name: DevOps End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Code Linting & App Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Lint Code with Flake8
        run: |
          # עצירת הריצה אם יש שגיאות תחביר חמורות
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # בדיקת סגנון ואזהרות (exit-zero מאפשר המשך)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  terraform-check:
    name: Terraform Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
         terraform_version: 1.9.5

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  docker-build:
    name: Build & Verify Docker Image
    needs: [lint-and-test, terraform-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: devops-microservice:test