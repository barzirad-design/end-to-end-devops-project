apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-deployment
  labels:
    app: devops-app
spec:
  # שרידות: תמיד ירוצו 2 מופעים במקביל
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        # שם ה-Image שנבנה בהמשך ב-Pipeline
        image: barzirad/devops-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000

        # Best Practice: הקצאה והגבלת משאבים למניעת עומס יתר
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

        # דגימת בריאות תקופתית (Health Check)
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20

        # בדיקה שהקונטיינר מוכן לשרת תעבורת משתמשים
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10