apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
spec:
  type: NodePort
  selector:
    app: devops-app
  ports:
    - protocol: TCP
      port: 80         # הפורט החיצוני של השירות
      targetPort: 5000 # הפורט הפנימי של אפליקציית הפייתון
      nodePort: 30080  # הפורט שדרכו ניגש מהדפדפן